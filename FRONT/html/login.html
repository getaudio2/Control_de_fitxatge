<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CRONOS - Login</title>
        <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="section__image">
        <img src="/FRONT/assets/pexels-filipe-sabino-881960-2065490.jpg" alt="">
    </div>
    <section class="section__login">
        <div class="login__contents">
            <h1>Bienvenido de nuevo</h2>
            <form action="./alumne_asistencia.html" id="login-form">
                <p>Usuario</p>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <p>ID instituto</p>
                <input type="text" placeholder="Introduce la ID de tu centro educativo" name="idschool">
                <p>Contraseña</p>
                <input type="password" placeholder="Introduce una contraseña" name="password">
                <button type="submit" class="button blue-button" id="login-form-submit">
                    Iniciar sesión
                </button>
                <a href="#">¿Has olvidado la contraseña?</a>
            </form>
            <div class="error hidden" id="error-div">Error: Usuario, ID instituto o contraseña incorrectos.
            </div>
        </div>
    </section>
    <script src="../js/login.js"></script>
</body>
</html>
