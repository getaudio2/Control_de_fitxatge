<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CRONOS - Página d'inici</title>
        <link rel="stylesheet" href="../css/pagina_inici.css">
    </head>
<body>
    <navbar class="navbar">
        <div class="navbar__logo">
            <img src="../assets/logoAppProject.png" alt="" height="50px" width="48px">
            <label for="" class="navbar__logo">CRONOS</label>
        </div>
        <div class="navbar__buttons">
            <button class="button borderless-button">Inicio</button>
            <button class="button borderless-button">Ayuda</button>
            <button class="button borderless-button">Funcionalidades</button>
            <button class="button borderless-button">Contacto</button>
            <button class="button white-button">Login</button>
            <button class="button blue-button">Registrarse</button>
        </div>
    </navbar>
    <section class="main-section">
        <h3 class="main-title">Solución digital para la gestió de fichaje</h3>
        <h4 class="main-subtitle">Cronos es una plataforma de comunicación web y móvil dirigida a colegios,
            profesores, padres y alumnos.
        </h4>
        <section class="button-section">
            <button class="button comenzar-button blue-button" id="comenzar-btn">Comenzar</button>
            <button class="button video-button white-button">Ver vídeo</button>
        </section>
    </section>
    <script src="../js/pagina_inici.js"></script>
</body>
</html>
