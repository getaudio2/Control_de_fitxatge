<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRONOS - Asistencias</title>
    <link rel="stylesheet" href="../css/alumne_asistencia.css">
    <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar__logo-section">
            <i class="fa-solid fa-bars"></i>
            <p class="navbar__logo">
                <img class="navbar__img" src="../assets/logoAppProject.png" alt="" height="50px" width="48px">
                CRONOS
            </p>
            <p class="navbar__school">Instituto TIC</p>
            <i class="fa-regular fa-envelope"></i>
            <i class="fa-regular fa-bell"></i>
        </div>
        <div class="navbar__user">
            <i class="fa-solid fa-user"></i>
            <div class="dropdown">
                <button class="dropbtn"><p class="name-user">Paúl López</p>
                    <i class="fa-solid fa-angle-down"></i>
                </button>
                <div class="dropdown-content">
                    <a href="/FRONT/html/perfil.html">Editar perfil</a>
                    <a href="/FRONT/html/pagina_inici.html">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-area">
        <div class="sidebar" id="sidebar">
            <div class="item">
                <i class="fa-regular fa-clock"></i>
                <a href="/FRONT/html/alumne_asistencia.html">Asistencia</a>
            </div>
            <div class="item">
                <i class="fa-solid fa-hourglass"></i>
                <p>Presencia</p>
            </div>
            <div class="item">
                <i class="fa-solid fa-user-check"></i>
                <p>Seguimiento</p>
            </div>
            <div class="item">
                <i class="fa-solid fa-bars"></i>
                <p>Horario escolar</p>
            </div>
            <div class="item">
                <i class="fa-regular fa-calendar"></i>
                <p>Calendario</p>
            </div>
            <div class="item">
                <i class="fa-solid fa-file-circle-plus"></i>
                <p>Justificantes</p>
            </div>
        </div>
        <div class="dashboard" id="dashboard">
            <h2 class="title">Resumen de asistencias</h2>
            <hr>
            <div class="filter-title">
                <p>Asignatura</p>
                <p>Fecha</p>
            </div>
            <div class="filter-drop">
                <select name="asignaturadrop" id="asignaturadrop">
                    <option value="asignatura">Asignatura</option>
                </select>
                <select name="fechadrop" id="fechadrop">
                    <option value="ultimos7">Últimos 7 días</option>
                </select>
            </div>
            <hr>
            <div class="asistencias-title">
                <p>Asignatura</p>
                <p>Fecha y hora</p>
                <p>Estado</p>
            </div>
            <hr>
            <div class="asistencias" id="asistencias"></div>
        </div>
    </div>
    <script src="../js/alumne_asistencia.js"></script>
</body>
</html>
