<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRONOS - Perfil</title>
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar__logo-section">
            <i class="fa-solid fa-bars"></i>
            <p class="navbar__logo">
                <img class="navbar__img" src="../assets/logoAppProject.png" alt="" height="50px" width="48px">
                CRONOS
            </p>
            <p class="navbar__school">Instituto TIC</p>
            <i class="fa-regular fa-envelope"></i>
            <i class="fa-regular fa-bell"></i>
        </div>
        <div class="navbar__user">
            <i class="fa-solid fa-user" id="icon-user"></i>
            <div class="dropdown">
                <button class="dropbtn"><p class="name-user">Eric Sánchez</p>
                    <i class="fa-solid fa-angle-down"></i>
                </button>
                <div class="dropdown-content">
                    <a href="#">Editar perfil</a>
                    <a href="/FRONT/html/pagina_inici.html">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-area">
        <div class="sidebar" id="sidebar">
            <div class="item">
                <i class="fa-regular fa-clock"></i>
                <a href="/FRONT/html/profe_asistencia.html" id="asistencia-link">Asistencia</a>
            </div>
            <div class="item">
                <i class="fa-solid fa-hourglass"></i>
                <p>Presencia</p>
            </div>
            <div class="item">
                <i class="fa-solid fa-user-check"></i>
                <p>Seguimiento</p>
            </div>
            <div class="item">
                <i class="fa-solid fa-bars"></i>
                <p>Horario escolar</p>
            </div>
            <div class="item">
                <i class="fa-regular fa-calendar"></i>
                <p>Calendario</p>
            </div>
            <div class="item">
                <i class="fa-solid fa-file-circle-plus"></i>
                <p>Justificantes</p>
            </div>
        </div>
        <div class="dashboard" id="dashboard">
            <h2 class="title">Editar perfil</h2>

            <div class="datos-perfil">
                <div class="datos-perfil-1">
                    <p>Nombre</p>
                    <input type="text" class="name-input" placeholder="">
                    <p>Apellidos</p>
                    <input type="text" class="surname-input" placeholder="">
                    <p>Email</p>
                    <input type="text" class="email-input" placeholder="">
                    <p>Departamento</p>
                    <input type="text" class="dept-input" placeholder="">
                </div>
    
                <div class="datos-perfil-2">
                    <p>Número identificativo</p>
                    <p class="perfil-id">0001111</p>
                    <span class="circle-bg"><i class="fa-solid fa-user"></i></span>
                    <br>
                    <a href="#">Cambiar foto</a>
                </div>
            </div>
            <button class="editBtn">Guardar</button>
        </div>
    </div>
    <script src="../js/perfil.js"></script>
</body>
</html>
